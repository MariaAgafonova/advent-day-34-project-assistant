name: Day 34 project assistant
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  project-assistant:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: project-assistant
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: project-assistant/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: node dist/cli.js --help
